<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .board {
        width: 1200px;
      }
    </style>
  </head>
  <body>
    <div class="board">
      <h1>자유게시판</h1>
      <iframe
        src="http://my714.dothome.co.kr/gnuboard5/bbs/login.php"
        id="iframe"
        onload="Height();"
        frameborder="0"
        style="width: 100%"
        scrolling="no"
      ></iframe>
    </div>
    <script>
      function Height() {
        var the_height =
          document.getElementById("iframe").contentWindow.document.body
            .scrollHeight;
        document.getElementById("iframe").height = the_height + 50;
        document.getElementById("iframe").style.overflow = "hidden";
      }
    </script>
  </body>
</html>
